[pytest]
# Only the cross-service suite by default.
#
# The service suites under services/*/tests each import their own code as "app",
# matching how the service is imported inside its container. A process can hold
# only one "app", so collecting them alongside each other makes one service's
# package answer for all of them. Run everything with:
#
#     python tools/run_tests.py
#
# which gives each suite its own process.
testpaths = tests

# Tests that need the bounded Docker profile running are marked "integration"
# and excluded by default. A service restarting mid-run is not a code failure,
# and a suite that goes red for it teaches people to ignore red.
#
#     python tools/run_tests.py --integration
#
markers =
    integration: requires the bounded Docker profile to be running
addopts = -m "not integration"
